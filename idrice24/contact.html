<!DOCTYPE html>
<html>
<link rel="stylesheet" type="text/css" href="css/header.css">
<link rel="stylesheet" type="text/css" href="css/main.css">
	<title>contact</title>
<body>
	<header>
            <iframe src="header.html" frameborder="0"></iframe>
    </header>

            <sec>

    		
    			<cont>Nous Retrouver</cont>
            	<cont>Nous contacter per Email</cont>
    		
            	
            	<form>
            		<textarea id="message" placeholder="message"></textarea>
            	<i></i>	<input type="text" name="name" id="name" placeholder="name">
            	<i></i>	<input type="email" name="email" id="email" placeholder="email">
            	<button onclick="sendEmail()">Send Message</button>
            	</form>
            </sec>

          <div class="map">
              <div class="container1">
                  <h3>Find Us</h3>
                  <div class="map-container">
                      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d661.8465586889445!2d-71.86880836371861!3d48.42992649809985!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cc1dd4044b005c7%3A0xe6a3086437d54012!2s3%20Rue%20de%20Saint-J%C3%A9rome%2C%20M%C3%A9tabetchouan-Lac-%C3%A0-la-Croix%2C%20QC%20G8G%201C1!5e0!3m2!1sen!2sca!4v1755463280655!5m2!1sen!2sca" width="700" height="600" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

        <footer>
            <iframe src="footer.html" frameborder="0"></iframe>
        </footer>


<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
	(function(){
    emailjs.init("email_OLmGyipuzjTeKo3PaLXcBf7R");
})();

function sendEmail(){
	event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;

    if(!name || !email || !message){
        alert("please fill in all fields.");
        return;
    }

    emailjs.send("service_8io57oi", "template_anq9fqd", {
        name: name,
        email: email,
        message: message
    }).then(() => {
        alert("Message sent successfully!");
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("message").value = "";
    }, (error) => {
        alert("Failed to send message: "+JSON.stringify(error));
    });
}


</script>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</body>
</html>
